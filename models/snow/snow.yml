version: 2

models:
  - name: employee_table
    description: "Employee DBT model"
    columns:
      - name: EMP_ID
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: [1,2,3,4]
                config:
                  severity: warn
      - name: emp_salary
        data_tests:
          - salary_check
  - name: product
    description: "Purchase DBT -delete/update Model"
  - name: purchase
    description: "Purchase DBT -Merge Model"

sources:
  - name: employee_table
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: EMPLOYEE_RAW
  - name: product
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PRODUCT_SRC
  - name: purchase
    database: DBT_DB
    schema: PUBLIC
    tables:
      - name: PURCHASE_SRC